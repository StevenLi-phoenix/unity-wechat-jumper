<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#79cfea}
    #unity-canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
    #loading{position:fixed;inset:0;display:grid;place-content:center;gap:16px;text-align:center;font:600 20px system-ui;color:#27423f;background:#e8ebdb;transition:opacity .25s}
    progress{width:260px;accent-color:#f45b69;height:12px;margin:auto}#error{max-width:28em;padding:24px}.brand{font-size:clamp(48px,10vw,92px);font-weight:1000;line-height:.9;letter-spacing:-4px;text-shadow:4px 5px #fff4de;margin-bottom:12px}.blocks{display:flex;justify-content:center;gap:12px;margin:10px}.blocks i{display:block;width:40px;height:40px;background:#ffd85a;box-shadow:0 8px #233457;transform:rotate(-8deg)}.blocks i:nth-child(2){background:#f45b69;transform:translateY(-14px) rotate(8deg)}.blocks i:nth-child(3){background:#62d5b4}
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="0" aria-label="Jump Jump game"></canvas>
  <div id="loading"><div class="blocks" aria-hidden="true"><i></i><i></i><i></i></div><div class="brand">JUMP<br>JUMP!</div><span>Packing tiny rooftops…</span><progress id="progress" max="1" value="0"></progress><div id="error" hidden></div></div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const canvas=document.getElementById('unity-canvas');
    const loading=document.getElementById('loading');
    createUnityInstance(canvas,{
      dataUrl:"Build/{{{ DATA_FILENAME }}}",
      frameworkUrl:"Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl:"Build/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl:"StreamingAssets",
      companyName:{{{ JSON.stringify(COMPANY_NAME) }}},
      productName:{{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion:{{{ JSON.stringify(PRODUCT_VERSION) }}},
      matchWebGLToCanvasSize:true,
      devicePixelRatio:Math.min(window.devicePixelRatio||1,2)
    },value=>document.getElementById('progress').value=value).then(()=>{
      loading.style.opacity='0';loading.style.pointerEvents='none';
      setTimeout(()=>loading.remove(),250);canvas.focus();
      console.info('JUMPER_WEBGL_READY');
    }).catch(error=>{
      console.error('JUMPER_WEBGL_LOAD_FAILED',error);
      const message=document.getElementById('error');message.hidden=false;
      message.textContent='Unable to load the game. Please reload and try again.';
    });
    canvas.addEventListener('pointerdown',()=>canvas.focus());
  </script>
</body>
</html>
